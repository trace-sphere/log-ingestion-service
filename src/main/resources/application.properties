#validate incoming jwt
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/logmanager
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/realms/logmanager/protocol/openid-connect/certs

#kafka properties
spring.kafka.bootstrap-servers=localhost:9094
spring.kafka.consumer.group-id=log-consumer-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.value.default.type=com.log.ingestion.log_ingestion_service.dto.LogRequestDto
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.properties.spring.json.use.type.headers=false
